name: Compilar APK do Snake
on: [push] # O processo começa toda vez que você envia um arquivo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Instalar Gomobile e Dependências
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          go mod init snake_projeto || true
          go mod tidy

      - name: Compilar APK
        run: |
          # Aqui ele gera o APK usando o seu arquivo snak.go
          gomobile build -target=android -o snake.apk snak.go

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v3
        with:
          name: meu-aplicativo-apk
          path: snake.apk
